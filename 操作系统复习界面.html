<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>操作系统复习工作台</title>
<style>
:root {
  --bg: #f5f7f9;
  --surface: #ffffff;
  --surface-soft: #eef3f5;
  --line: #d9e1e5;
  --text: #16222b;
  --muted: #5f6f7a;
  --green: #178a62;
  --green-soft: #e5f4ee;
  --blue: #2f6fb0;
  --blue-soft: #e6f0fa;
  --amber: #b56b13;
  --amber-soft: #fff1d8;
  --red: #b84036;
  --red-soft: #ffe8e4;
  --violet: #6b58a8;
  --violet-soft: #eeeafd;
  --shadow: 0 10px 24px rgba(25, 39, 52, 0.08);
}

* { box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
}

button, input {
  font: inherit;
}

.app-shell {
  min-height: 100vh;
  display: grid;
  grid-template-columns: 248px minmax(0, 1fr) 300px;
}

.sidebar {
  position: sticky;
  top: 0;
  height: 100vh;
  padding: 22px 18px;
  background: #14212a;
  color: #f4f7f8;
  border-right: 1px solid #1e333f;
  overflow-y: auto;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 22px;
}

.brand-mark {
  width: 34px;
  height: 34px;
  border-radius: 8px;
  background: linear-gradient(135deg, #2e9d72, #2f6fb0);
  display: grid;
  place-items: center;
  font-weight: 800;
  color: white;
}

.brand-title {
  display: grid;
  gap: 2px;
}

.brand-title strong {
  font-size: 17px;
  line-height: 1.2;
}

.brand-title span {
  font-size: 12px;
  color: #b8c6ce;
}

.nav-block {
  margin: 18px 0;
}

.nav-label {
  color: #9fb0ba;
  font-size: 12px;
  margin: 0 0 8px;
}

.nav-list {
  display: grid;
  gap: 4px;
}

.nav-link {
  width: 100%;
  text-align: left;
  border: 0;
  background: transparent;
  color: #e8eef1;
  padding: 9px 10px;
  border-radius: 8px;
  cursor: pointer;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.nav-link:hover,
.nav-link.active {
  background: rgba(255, 255, 255, 0.1);
}

.nav-link small {
  color: #a9bac3;
}

.sidebar-actions {
  display: grid;
  gap: 8px;
  margin-top: 20px;
}

.side-button {
  display: inline-flex;
  justify-content: center;
  align-items: center;
  min-height: 38px;
  padding: 8px 10px;
  border-radius: 8px;
  border: 1px solid rgba(255, 255, 255, 0.18);
  background: rgba(255, 255, 255, 0.08);
  color: #f8fbfc;
  text-decoration: none;
  cursor: pointer;
}

.side-button.primary {
  background: #1f9a70;
  border-color: #1f9a70;
  color: white;
}

.content {
  min-width: 0;
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  background: rgba(245, 247, 249, 0.94);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
  padding: 16px 26px;
}

.topbar-row {
  display: flex;
  gap: 12px;
  align-items: center;
}

.search {
  position: relative;
  flex: 1;
  min-width: 180px;
}

.search input {
  width: 100%;
  height: 42px;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 0 14px 0 38px;
  background: var(--surface);
  color: var(--text);
  outline: none;
}

.search input:focus {
  border-color: var(--blue);
  box-shadow: 0 0 0 3px rgba(47, 111, 176, 0.13);
}

.search::before {
  content: "";
  position: absolute;
  left: 14px;
  top: 50%;
  width: 13px;
  height: 13px;
  border: 2px solid var(--muted);
  border-radius: 50%;
  transform: translateY(-55%);
}

.search::after {
  content: "";
  position: absolute;
  left: 27px;
  top: 27px;
  width: 8px;
  height: 2px;
  background: var(--muted);
  transform: rotate(45deg);
  transform-origin: left center;
}

.segmented {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.segment {
  min-height: 38px;
  padding: 7px 12px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--muted);
  cursor: pointer;
}

.segment.active {
  border-color: var(--text);
  color: var(--text);
  background: #eef0f2;
  font-weight: 700;
}

.main-wrap {
  max-width: 1040px;
  margin: 0 auto;
  padding: 26px;
}

.page-title {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 20px;
}

.page-title h1 {
  margin: 0;
  font-size: clamp(24px, 3vw, 34px);
  line-height: 1.2;
  letter-spacing: 0;
}

.page-title p {
  margin: 8px 0 0;
  color: var(--muted);
  max-width: 760px;
}

.status-pill {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  min-height: 34px;
  padding: 6px 10px;
  border-radius: 8px;
  background: var(--green-soft);
  color: var(--green);
  font-size: 13px;
  font-weight: 700;
}

.metrics {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px;
  margin-bottom: 24px;
}

.metric {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 16px;
  min-height: 96px;
}

.metric strong {
  display: block;
  font-size: 26px;
  line-height: 1;
  margin-bottom: 8px;
}

.metric span {
  color: var(--muted);
  font-size: 13px;
}

.band {
  padding: 24px 0;
  border-top: 1px solid var(--line);
}

.band:first-of-type {
  border-top: 0;
}

.band-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 14px;
  margin-bottom: 14px;
}

.band h2 {
  margin: 0;
  font-size: 22px;
  line-height: 1.25;
  letter-spacing: 0;
}

.tag {
  display: inline-flex;
  align-items: center;
  min-height: 28px;
  padding: 3px 9px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 700;
}

.tag.choice { background: var(--blue-soft); color: var(--blue); }
.tag.short { background: var(--green-soft); color: var(--green); }
.tag.calc { background: var(--amber-soft); color: var(--amber); }
.tag.concurrent { background: var(--violet-soft); color: var(--violet); }
.tag.year { background: var(--red-soft); color: var(--red); }
.tag.sprint { background: #e9edf0; color: #43515b; }

.summary {
  margin: 0 0 16px;
  color: var(--muted);
}

.note-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}

.note {
  background: var(--surface);
  border: 1px solid var(--line);
  border-left: 4px solid var(--blue);
  border-radius: 8px;
  padding: 13px 14px;
  min-height: 62px;
}

.note.green { border-left-color: var(--green); }
.note.amber { border-left-color: var(--amber); }
.note.red { border-left-color: var(--red); }
.note.violet { border-left-color: var(--violet); }

.note strong {
  display: block;
  margin-bottom: 4px;
}

.note p,
.note ul,
.note ol {
  margin: 0;
  color: var(--muted);
}

.note ul,
.note ol {
  padding-left: 18px;
}

.formula {
  display: grid;
  gap: 8px;
}

.formula-row {
  display: grid;
  grid-template-columns: 170px minmax(0, 1fr);
  gap: 12px;
  align-items: center;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 10px 12px;
}

.formula-row code {
  display: inline-block;
  white-space: normal;
  word-break: break-word;
  color: #26343e;
}

code, pre {
  font-family: "Cascadia Code", Consolas, "Courier New", monospace;
}

pre {
  margin: 10px 0 0;
  padding: 14px;
  overflow: auto;
  background: #14212a;
  color: #eaf2f5;
  border-radius: 8px;
  line-height: 1.55;
}

.process-diagram {
  display: grid;
  gap: 10px;
  margin-top: 12px;
}

.state-row {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 8px;
}

.state {
  min-height: 52px;
  display: grid;
  place-items: center;
  text-align: center;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: var(--surface);
  font-weight: 700;
}

.state.accent { background: var(--green-soft); color: var(--green); border-color: #b9ddcf; }
.state.warn { background: var(--amber-soft); color: var(--amber); border-color: #edd4a9; }

.timeline {
  display: grid;
  gap: 9px;
}

.year-row {
  display: grid;
  grid-template-columns: 72px minmax(0, 1fr);
  gap: 12px;
  align-items: start;
  padding: 12px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 8px;
}

.year-row strong {
  color: var(--red);
  font-size: 15px;
}

.year-row p {
  margin: 0;
  color: var(--muted);
}

.rightbar {
  position: sticky;
  top: 0;
  height: 100vh;
  padding: 20px 18px;
  background: #fbfcfd;
  border-left: 1px solid var(--line);
  overflow-y: auto;
}

.tool {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 14px;
  margin-bottom: 14px;
  box-shadow: var(--shadow);
}

.tool h3 {
  margin: 0 0 10px;
  font-size: 16px;
}

.flashcard {
  min-height: 178px;
  display: grid;
  gap: 10px;
}

.flashcard-kind {
  color: var(--muted);
  font-size: 12px;
  font-weight: 700;
}

.flashcard-question {
  font-weight: 700;
}

.flashcard-answer {
  display: none;
  color: var(--muted);
  padding-top: 8px;
  border-top: 1px dashed var(--line);
}

.flashcard-answer.show {
  display: block;
}

.button-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.button {
  min-height: 36px;
  padding: 7px 10px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--surface);
  color: var(--text);
  cursor: pointer;
}

.button:hover {
  border-color: var(--blue);
}

.button.primary {
  background: var(--text);
  color: white;
  border-color: var(--text);
}

.checklist {
  display: grid;
  gap: 8px;
}

.check-item {
  display: grid;
  grid-template-columns: 20px minmax(0, 1fr);
  gap: 8px;
  align-items: start;
  color: var(--muted);
  font-size: 14px;
}

.check-item input {
  width: 16px;
  height: 16px;
  margin-top: 4px;
  accent-color: var(--green);
}

.check-item.done {
  color: #84919a;
  text-decoration: line-through;
}

.progress {
  height: 8px;
  background: #e6ebee;
  border-radius: 999px;
  overflow: hidden;
  margin-bottom: 12px;
}

.progress-fill {
  height: 100%;
  width: 0;
  background: linear-gradient(90deg, var(--green), var(--blue));
  transition: width 0.25s ease;
}

.empty-state {
  display: none;
  padding: 28px 0;
  color: var(--muted);
  text-align: center;
}

mark {
  background: #ffef99;
  color: inherit;
  padding: 0 2px;
  border-radius: 3px;
}

@media (max-width: 1160px) {
  .app-shell {
    grid-template-columns: 220px minmax(0, 1fr);
  }

  .rightbar {
    grid-column: 1 / -1;
    position: static;
    height: auto;
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 14px;
  }

  .tool {
    margin-bottom: 0;
  }
}

@media (max-width: 820px) {
  .app-shell {
    display: block;
  }

  .sidebar {
    position: static;
    height: auto;
  }

  .nav-list {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .topbar {
    position: static;
  }

  .topbar-row,
  .page-title {
    flex-direction: column;
    align-items: stretch;
  }

  .metrics,
  .note-grid,
  .rightbar {
    grid-template-columns: 1fr;
  }

  .state-row {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .formula-row,
  .year-row {
    grid-template-columns: 1fr;
  }

  .main-wrap {
    padding: 20px 16px;
  }
}

@media print {
  .sidebar,
  .topbar,
  .rightbar {
    display: none;
  }

  .app-shell {
    display: block;
  }

  .main-wrap {
    max-width: none;
    padding: 0;
  }

  .band {
    break-inside: avoid;
  }
}
</style>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">OS</div>
      <div class="brand-title">
        <strong>操作系统复习</strong>
        <span>Exam + Mooc</span>
      </div>
    </div>

    <div class="nav-block">
      <p class="nav-label">目录</p>
      <div id="navList" class="nav-list"></div>
    </div>

    <div class="nav-block">
      <p class="nav-label">工具</p>
      <div class="sidebar-actions">
        <a class="side-button primary" href="Mooc/quiz.html">题库练习</a>
        <button class="side-button" id="printButton" type="button">打印讲义</button>
      </div>
    </div>
  </aside>

  <main class="content">
    <div class="topbar">
      <div class="topbar-row">
        <label class="search" aria-label="关键词">
          <input id="searchInput" type="search" placeholder="关键词">
        </label>
        <div class="segmented" id="typeFilter"></div>
      </div>
    </div>

    <div class="main-wrap">
      <div class="page-title">
        <div>
          <h1>操作系统复习工作台</h1>
          <p>按当前分支的讲义内容重排，保留重点、模板、年份复盘和冲刺清单。</p>
        </div>
        <span id="resultCount" class="status-pill">全部内容</span>
      </div>

      <section class="metrics" aria-label="统计">
        <div class="metric"><strong>15</strong><span>资料文件纳入范围</span></div>
        <div class="metric"><strong>100</strong><span>MOOC 题库题量</span></div>
        <div class="metric"><strong>9</strong><span>历年期末与回忆卷</span></div>
        <div class="metric"><strong>3</strong><span>冲刺复习轮次</span></div>
      </section>

      <div id="sectionHost"></div>
      <div id="emptyState" class="empty-state">没有匹配内容</div>
    </div>
  </main>

  <aside class="rightbar">
    <section class="tool">
      <h3>速记抽卡</h3>
      <div class="flashcard">
        <div id="flashKind" class="flashcard-kind"></div>
        <div id="flashQuestion" class="flashcard-question"></div>
        <div id="flashAnswer" class="flashcard-answer"></div>
        <div class="button-row">
          <button class="button primary" id="showAnswer" type="button">显示答案</button>
          <button class="button" id="prevCard" type="button">上一张</button>
          <button class="button" id="nextCard" type="button">下一张</button>
        </div>
      </div>
    </section>

    <section class="tool">
      <h3>冲刺进度</h3>
      <div class="progress"><div id="progressFill" class="progress-fill"></div></div>
      <div id="checklist" class="checklist"></div>
    </section>
  </aside>
</div>

<script>
const TYPE_LABELS = [
  { id: "all", label: "全部" },
  { id: "choice", label: "选择题" },
  { id: "short", label: "简答" },
  { id: "calc", label: "计算" },
  { id: "concurrent", label: "并发" },
  { id: "year", label: "年份" },
  { id: "sprint", label: "冲刺" }
];

const SECTIONS = [
  {
    id: "source",
    type: "sprint",
    title: "资料范围",
    tag: "冲刺",
    summary: "来自当前分支的 Exam 与 Mooc 目录，图片型 PDF 只纳入能人工确认的题型。",
    notes: [
      { tone: "green", title: "已覆盖文件", body: "2013、2014、2015-期中、2015、2016、2019、2020、2021、2022、2025、期末分类汇编、MOOC 合集、选择题分类汇编、quiz.html。" },
      { tone: "amber", title: "2015 期末卷", body: "图片型 PDF；可确认题型为选择题、进程调度、OPT/LRU、银行家算法、读者写者 PV、哲学家管程、作业调度。" },
      { tone: "red", title: "答案来源处理", body: "带有“答案不保证正确”说明的汇编只用于考点归纳，讲义不把这些答案作为唯一标准。" }
    ]
  },
  {
    id: "priority",
    type: "sprint",
    title: "复习优先级",
    tag: "冲刺",
    summary: "先拿高频计算题和可背模板，再补选择题细节。",
    notes: [
      { tone: "red", title: "第一优先级", body: "进程状态模型、调度、页面置换、文件索引、磁盘调度、银行家算法、PV 和管程。" },
      { tone: "amber", title: "第二优先级", body: "系统调用、陷入机制、内核态/用户态、I/O 软件层次、DMA、SPOOLing、目录项、inode、open/create。" },
      { tone: "blue", title: "第三优先级", body: "操作系统分类、多线程模型、存储碎片、分页/分段/固定分区/可变分区/段页式。" }
    ]
  },
  {
    id: "choice-os",
    type: "choice",
    title: "高频选择题速记",
    tag: "选择题",
    summary: "覆盖操作系统概述、系统调用、进程线程、存储、设备、文件管理。",
    notes: [
      { tone: "blue", title: "操作系统概述", body: "操作系统管理计算机资源；配置操作系统后的机器称为虚拟计算机；分时系统支持多终端交互；实时系统强调规定时间、可靠性、安全性。" },
      { tone: "green", title: "多道程序设计", body: "在一台处理机上并发运行多个程序，提高 CPU 和外部设备利用率；前提之一是中断功能。" },
      { tone: "amber", title: "系统调用", body: "系统调用是操作系统向用户程序提供的接口；用户程序的输入输出操作实际由操作系统完成。" },
      { tone: "red", title: "内核态", body: "CPU 执行操作系统内核代码时处于管态/核心态；输入/输出指令必须在管态/核心态下执行。" },
      { tone: "violet", title: "进程与线程", body: "进程映像包括程序块、数据块、核心栈、PCB；引入线程后，进程仍是资源分配基本单位，线程是调度基本单位。" },
      { tone: "green", title: "状态转换", body: "等待态不能直接到运行态；时间片用完是运行态到就绪态；等待事件发生是阻塞态到就绪态；唤醒后进入就绪状态。" },
      { tone: "blue", title: "fork", body: "每次 fork() 调用都会使当前所有进程各复制一次；连续 3 次 fork() 后总进程数为 8，新产生进程数为 7。" },
      { tone: "amber", title: "碎片", body: "分段存储管理不会产生内部碎片；分页存储管理不会产生外部碎片；段式存储的段是不定长连续区域。" },
      { tone: "red", title: "页面替换", body: "FIFO 可能产生 Belady 异常；LRU 基于最近最少使用；虚存可行性基础是局部性原理。" },
      { tone: "violet", title: "设备管理", body: "DMA 不经过 CPU 传输；通道用于主存与 I/O 设备之间传输；SPOOLing 将独占设备转化为共享设备。" },
      { tone: "green", title: "文件管理", body: "Unix 文件索引结构存放在 inode 节点；目录项实现按名存取；open 输入包含文件名，返回文件描述符；create 返回文件描述符。" }
    ]
  },
  {

function escapeHtml(value) {
  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;");
}

function highlight(text, keyword) {
  const safe = escapeHtml(text);
  if (!keyword) return safe;
  const escaped = keyword.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  return safe.replace(new RegExp(escaped, "gi"), match => `<mark>${match}</mark>`);
}

function sectionText(section) {
  return JSON.stringify(section).toLowerCase();
}

function typeName(type) {
  const item = TYPE_LABELS.find(entry => entry.id === type);
  return item ? item.label : type;
}

function renderTypeFilter() {
  typeFilter.innerHTML = TYPE_LABELS.map(item => (
    `<button class="segment ${item.id === activeType ? "active" : ""}" type="button" data-type="${item.id}">${item.label}</button>`
  )).join("");
}

function renderNav(visibleSections) {
  navList.innerHTML = visibleSections.map(section => (
    `<button class="nav-link" type="button" data-target="${section.id}">
      <span>${escapeHtml(section.title)}</span>
      <small>${escapeHtml(typeName(section.type))}</small>
    </button>`
  )).join("");
}

function noteHtml(note, keyword) {
  return `<article class="note ${note.tone || ""}">
    <strong>${highlight(note.title, keyword)}</strong>
    <p>${highlight(note.body, keyword)}</p>
  </article>`;
}

function orderedHtml(items, keyword) {
  if (!items || !items.length) return "";
  return `<div class="note green"><strong>步骤</strong><ol>${items.map(item => `<li>${highlight(item, keyword)}</li>`).join("")}</ol></div>`;
}

function formulasHtml(items, keyword) {
  if (!items || !items.length) return "";
  return `<div class="formula">${items.map(([label, formula]) => (
    `<div class="formula-row"><strong>${highlight(label, keyword)}</strong><code>${highlight(formula, keyword)}</code></div>`
  )).join("")}</div>`;
}

function yearsHtml(items, keyword) {
  if (!items || !items.length) return "";
  return `<div class="timeline">${items.map(([year, body]) => (
    `<div class="year-row"><strong>${highlight(year, keyword)}</strong><p>${highlight(body, keyword)}</p></div>`
  )).join("")}</div>`;
}

function processDiagramHtml() {

    <div class="state-row">
      <div class="state">新建</div>
      <div class="state accent">就绪</div>
      <div class="state accent">运行</div>

      <div class="state">提交</div>
      <div class="state">唤醒</div>
      <div class="state">撤销</div>
    </div>
  </div>`;
}

function renderSections() {
  const keyword = searchInput.value.trim().toLowerCase();
  const visible = SECTIONS.filter(section => {
    const byType = activeType === "all" || section.type === activeType;
    const bySearch = !keyword || sectionText(section).includes(keyword);
    return byType && bySearch;
  });

  sectionHost.innerHTML = visible.map(section => {
    const notes = section.notes ? section.notes.map(note => noteHtml(note, keyword)).join("") : "";
    const ordered = orderedHtml(section.ordered, keyword);
    const formulas = formulasHtml(section.formulas, keyword);
    const years = yearsHtml(section.years, keyword);
    const code = section.code ? `<pre><code>${escapeHtml(section.code)}</code></pre>` : "";
    const diagram = section.diagram ? processDiagramHtml() : "";
    return `<section class="band" id="${section.id}" data-type="${section.type}">
      <div class="band-head">
        <h2>${highlight(section.title, keyword)}</h2>
        <span class="tag ${section.type}">${escapeHtml(section.tag)}</span>
      </div>
      <p class="summary">${highlight(section.summary, keyword)}</p>
      ${diagram}
      ${formulas}
      <div class="note-grid">${ordered}${notes}</div>
      ${years}
      ${code}
    </section>`;
  }).join("");

  renderNav(visible);
  emptyState.style.display = visible.length ? "none" : "block";
  resultCount.textContent = visible.length === SECTIONS.length ? "全部内容" : `${visible.length} 项内容`;
}

    const done = Boolean(checkedItems[index]);
    return `<label class="check-item ${done ? "done" : ""}">
      <input type="checkbox" data-check="${index}" ${done ? "checked" : ""}>
      <span>${escapeHtml(item)}</span>
    </label>`;
  }).join("");
  const doneCount = CHECK_ITEMS.filter((_, index) => checkedItems[index]).length;
  progressFill.style.width = `${Math.round(doneCount / CHECK_ITEMS.length * 100)}%`;
}

typeFilter.addEventListener("click", event => {
  const button = event.target.closest("[data-type]");
  if (!button) return;
  activeType = button.dataset.type;
  renderTypeFilter();
  renderSections();
});

navList.addEventListener("click", event => {
  const button = event.target.closest("[data-target]");
  if (!button) return;
  const target = document.getElementById(button.dataset.target);
  if (target) target.scrollIntoView({ behavior: "smooth", block: "start" });
});

searchInput.addEventListener("input", renderSections);

document.getElementById("showAnswer").addEventListener("click", () => {
  document.getElementById("flashAnswer").classList.toggle("show");
});

document.getElementById("prevCard").addEventListener("click", () => {
  activeCard = (activeCard - 1 + FLASHCARDS.length) % FLASHCARDS.length;
  renderFlashcard();
});

document.getElementById("nextCard").addEventListener("click", () => {
  activeCard = (activeCard + 1) % FLASHCARDS.length;
  renderFlashcard();
});

checklist.addEventListener("change", event => {
  const input = event.target.closest("[data-check]");
  if (!input) return;
  checkedItems[input.dataset.check] = input.checked;
  saveChecks();
  renderChecklist();
});

document.getElementById("printButton").addEventListener("click", () => window.print());

renderTypeFilter();
renderSections();
renderFlashcard();
renderChecklist();
</script>
</body>
</html>
