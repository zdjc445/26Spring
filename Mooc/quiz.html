<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>操作系统 MOOC 刷题</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #0f0f23;
    color: #e0e0e0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
}
.container {
    max-width: 800px;
    width: 100%;
    padding: 24px 20px;
}
header {
    text-align: center;
    margin-bottom: 20px;
}
header h1 {
    font-size: 24px;
    color: #00e676;
    margin-bottom: 4px;
}
header .sub {
    font-size: 13px;
    color: #888;
}

/* Stats bar */
.stats-bar {
    display: flex;
    gap: 16px;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 16px;
}
.stat {
    background: #1a1a3e;
    border-radius: 10px;
    padding: 12px 18px;
    text-align: center;
    min-width: 80px;
}
.stat .num {
    font-size: 28px;
    font-weight: 700;
    color: #00e676;
}
.stat .label { font-size: 12px; color: #888; margin-top: 2px; }

/* Part filter */
.part-filter {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 16px;
    justify-content: center;
}
.part-btn {
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid #333;
    background: transparent;
    color: #aaa;
    cursor: pointer;
    font-size: 13px;
    transition: all .2s;
}
.part-btn:hover { border-color: #00e676; color: #fff; }
.part-btn.active { background: #00e676; color: #000; border-color: #00e676; font-weight: 600; }

/* Quiz card */
.quiz-card {
    background: #1a1a3e;
    border-radius: 16px;
    padding: 28px 24px;
    margin-bottom: 16px;
    border: 1px solid #2a2a5e;
}
.question-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
    flex-wrap: wrap;
    gap: 8px;
}
.question-tag {
    font-size: 12px;
    background: #2a2a5e;
    padding: 4px 10px;
    border-radius: 12px;
    color: #aaa;
}
.question-num {
    font-size: 13px;
    color: #00e676;
    font-weight: 600;
}
.question-text {
    font-size: 16px;
    line-height: 1.7;
    margin-bottom: 20px;
    color: #fff;
}

/* Options */
.options { display: flex; flex-direction: column; gap: 10px; }
.option {
    padding: 13px 16px;
    border-radius: 10px;
    border: 1.5px solid #2a2a5e;
    background: #13132e;
    cursor: pointer;
    transition: all .2s;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 15px;
    user-select: none;
}
.option:hover { border-color: #00e676; background: #1a1a3e; }
.option .letter {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: #2a2a5e;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 13px; flex-shrink: 0;
    color: #aaa;
}
.option.correct { border-color: #00e676; background: #0a2a0a; }
.option.correct .letter { background: #00e676; color: #000; }
.option.wrong { border-color: #ff5252; background: #2a0a0a; }
.option.wrong .letter { background: #ff5252; color: #fff; }
.option.disabled { pointer-events: none; opacity: 0.85; }

/* Explanation */
.explanation {
    margin-top: 16px;
    padding: 16px;
    border-radius: 10px;
    background: #0a1a0a;
    border: 1px solid #1a3a1a;
    display: none;
    font-size: 14px;
    line-height: 1.6;
    white-space: pre-line;
}
.explanation.show { display: block; }
.explanation .verdict {
    font-weight: 700;
    margin-bottom: 6px;
    font-size: 15px;
}
.explanation .verdict.yes { color: #00e676; }
.explanation .verdict.no { color: #ff5252; }

/* Navigation */
.nav-row {
    display: flex;
    gap: 10px;
    justify-content: center;
    align-items: center;
    margin-top: 16px;
    flex-wrap: wrap;
}
.nav-btn {
    padding: 10px 24px;
    border-radius: 25px;
    border: 1px solid #333;
    background: #1a1a3e;
    color: #ccc;
    cursor: pointer;
    font-size: 14px;
    transition: all .2s;
}
.nav-btn:hover { background: #2a2a5e; border-color: #00e676; }
.nav-btn.primary { background: #00e676; color: #000; border-color: #00e676; font-weight: 600; }
.nav-btn.primary:hover { background: #00c853; }
.nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }

/* Progress */
.progress-wrap {
    margin: 16px 0 8px;
    background: #1a1a3e;
    border-radius: 10px;
    height: 8px;
    overflow: hidden;
}
.progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #00e676, #00c853);
    border-radius: 10px;
    transition: width .3s;
}

/* Question grid */
.question-grid {
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    gap: 5px;
    margin-bottom: 16px;
    max-height: 200px;
    overflow-y: auto;
    padding: 4px;
}
.q-dot {
    aspect-ratio: 1;
    border-radius: 6px;
    background: #1a1a3e;
    border: 1px solid #2a2a5e;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; color: #aaa;
    transition: all .15s;
    min-width: 28px;
}
.q-dot:hover { border-color: #00e676; }
.q-dot.correct-dot { background: #0a3a0a; border-color: #00e676; }
.q-dot.wrong-dot { background: #3a0a0a; border-color: #ff5252; }
.q-dot.current { border-color: #fff; box-shadow: 0 0 8px rgba(255,255,255,0.4); }

/* Reset button */
.reset-btn {
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid #ff5252;
    background: transparent;
    color: #ff5252;
    cursor: pointer;
    font-size: 12px;
    transition: all .2s;
    margin-left: auto;
}
.reset-btn:hover { background: #2a0a0a; }

@media (max-width: 600px) {
    .question-grid { grid-template-columns: repeat(10, 1fr); gap: 3px; }
    .q-dot { font-size: 9px; min-width: 22px; border-radius: 4px; }
    .quiz-card { padding: 20px 16px; }
    .question-text { font-size: 15px; }
    .option { font-size: 14px; padding: 11px 14px; }
}
</style>
</head>
<body>
<div class="container">
    <header>
        <h1>📚 操作系统 MOOC 刷题</h1>
        <div class="sub">选择题分类汇编 · 共 <span id="totalCount">100</span> 题</div>
    </header>

    <div class="stats-bar">
        <div class="stat"><div class="num" id="statDone">0</div><div class="label">已做</div></div>
        <div class="stat"><div class="num" id="statCorrect">0</div><div class="label">正确 ✅</div></div>
        <div class="stat"><div class="num" id="statWrong">0</div><div class="label">错误 ❌</div></div>
        <div class="stat"><div class="num" id="statRate">-</div><div class="label">正确率</div></div>
    </div>

    <div class="part-filter" id="partFilter"></div>

    <div class="question-grid" id="questionGrid"></div>

    <div class="quiz-card" id="quizCard">
        <div class="question-header">
            <span class="question-tag" id="partTag"></span>
            <span class="question-num" id="qNum"></span>
        </div>
        <div class="question-text" id="qText"></div>
        <div class="options" id="options"></div>
        <div class="explanation" id="explanation"></div>
    </div>

    <div class="nav-row">
        <button class="nav-btn" id="btnPrev">◀ 上一题</button>
        <button class="nav-btn primary" id="btnNext">下一题 ▶</button>
    </div>
    <div class="progress-wrap"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
</div>

<script>
const QUESTIONS = [
  {

  },
  {
    "id": 2,
    "part": 1,
    "partName": "第一部分",
    "num": 3,
    "text": "_____不是一个操作系统环境。",

      "Solaris",

      "Celeron",

    "answer": "C",

  },
  {

    "partName": "第一部分",

    "text": "____该操作系统的系统响应时间的重要性超过协同资源的利用率，它被广泛地应用于卫星控制、导弹发射、工业控制、飞机订票业务灯领域。",

  {

    "partName": "第一部分",
    "num": 5,
    "text": "允许在一台主机上同时连接多个终端，各个用户可以通过各自的终端交互使用计算机，这样的操作系统是______。",
    "options": [
      "网络操作系统",
      "分时操作系统",
      "批处理操作系统",

  {

  {

  },
  {

  },
  {

  },
  {
    "id": 11,

  },
  {
    "id": 12,
    "part": 1,
    "partName": "第一部分",
    "num": 13,
    "text": "多道程序设计是指______。",
    "options": [

  {

const PART_NAMES = ["Part 1", "第一部分", "第二部分", "第三部分", "第四部分", "第五部分"];

document.getElementById('totalCount').textContent = QUESTIONS.length;

let state = {
    currentIndex: 0,
    answers: {},
    filterPart: -1,
    wrongList: [],  // ids of questions answered wrong
};

const saved = localStorage.getItem('os-quiz-state-v2');
if (saved) {
    try {
        const parsed = JSON.parse(saved);
        state.answers = parsed.answers || {};
        state.currentIndex = parsed.currentIndex || 0;
        state.filterPart = parsed.filterPart ?? -1;
        state.wrongList = parsed.wrongList || [];
    } catch(e) {}
}

function getFiltered() {
    if (state.filterPart < 0) return QUESTIONS;
    return QUESTIONS.filter(q => q.part === state.filterPart);
}

function save() {
    localStorage.setItem('os-quiz-state-v2', JSON.stringify({
        answers: state.answers,
        currentIndex: state.currentIndex,
        filterPart: state.filterPart,
        wrongList: state.wrongList,
    }));
}

function getStats() {
    const filtered = getFiltered();
    let done = 0, correct = 0, wrong = 0;
    filtered.forEach(q => {
        if (state.answers[q.id] !== undefined) {
            done++;
            if (state.answers[q.id] === q.answer) correct++;
            else wrong++;
        }
    });
    return { done, correct, wrong, total: filtered.length };
}

function updateStats() {
    const s = getStats();
    document.getElementById('statDone').textContent = s.done;
    document.getElementById('statCorrect').textContent = s.correct;
    document.getElementById('statWrong').textContent = s.wrong;
    document.getElementById('statRate').textContent = s.done > 0 ? Math.round(s.correct / s.done * 100) + '%' : '-';
    document.getElementById('progressFill').style.width = (s.total > 0 ? s.done / s.total * 100 : 0) + '%';
}

function updateGrid() {
    const grid = document.getElementById('questionGrid');
    const filtered = getFiltered();
    grid.innerHTML = filtered.map((q, i) => {
        let cls = '';
        if (i === state.currentIndex) cls += ' current';
        if (state.answers[q.id] !== undefined) {
            cls += state.answers[q.id] === q.answer ? ' correct-dot' : ' wrong-dot';
        }
        return `<div class="q-dot${cls}" onclick="goTo(${i})" title="${q.partName} #${q.num}">${q.id+1}</div>`;
    }).join('');
}

function goTo(index) {
    const filtered = getFiltered();
    if (index < 0 || index >= filtered.length) return;
    state.currentIndex = index;
    renderQuestion();
    updateGrid();
    save();
}

function renderQuestion() {
    const filtered = getFiltered();
    if (filtered.length === 0) {
        document.getElementById('qText').textContent = '该分类下没有题目';
        document.getElementById('options').innerHTML = '';
        document.getElementById('explanation').className = 'explanation';
        document.getElementById('btnPrev').disabled = true;
        document.getElementById('btnNext').disabled = true;
        return;
    }
    if (state.currentIndex >= filtered.length) state.currentIndex = 0;
    if (state.currentIndex < 0) state.currentIndex = 0;

    const q = filtered[state.currentIndex];
    document.getElementById('partTag').textContent = q.partName;
    document.getElementById('qNum').textContent = `#${q.id + 1} / ${filtered.length} 题`;
    document.getElementById('qText').textContent = q.text;

    const letters = ['A', 'B', 'C', 'D'];
    const userAns = state.answers[q.id];
    const answered = userAns !== undefined;

    document.getElementById('options').innerHTML = q.options.map((opt, i) => {
        let cls = '';
        if (answered) {
            if (letters[i] === q.answer) cls = ' correct';
            else if (letters[i] === userAns) cls = ' wrong';
            cls += ' disabled';
        }
        return `<div class="option${cls}" onclick="selectAnswer(${q.id}, '${letters[i]}')">
            <div class="letter">${letters[i]}</div>
            <span>${opt}</span>
        </div>`;
    }).join('');

    const expDiv = document.getElementById('explanation');
    if (answered) {
        const isCorrect = userAns === q.answer;
        expDiv.innerHTML = `
            <div class="verdict ${isCorrect ? 'yes' : 'no'}">${isCorrect ? '✅ 正确！' : '❌ 错误，正确答案是 ' + q.answer}</div>
            <div>${q.explanation}</div>
        `;
        expDiv.className = 'explanation show';
    } else {
        expDiv.className = 'explanation';
    }

    document.getElementById('btnPrev').disabled = state.currentIndex === 0;
    document.getElementById('btnNext').disabled = state.currentIndex >= filtered.length - 1;

    updateStats();
    updateGrid();
    // Scroll to current question in grid
    const grid = document.getElementById('questionGrid');
    const dots = grid.children;
    if (dots[state.currentIndex]) {
        dots[state.currentIndex].scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }
}

function selectAnswer(qid, letter) {
    if (state.answers[qid] !== undefined) return;
    const q = QUESTIONS[qid];
    state.answers[qid] = letter;
    if (letter !== q.answer) {
        if (!state.wrongList.includes(qid)) state.wrongList.push(qid);
    } else {
        state.wrongList = state.wrongList.filter(id => id !== qid);
    }
    renderQuestion();
    save();
}

function renderPartFilter() {
    const container = document.getElementById('partFilter');
    container.innerHTML = `<button class="part-btn${state.filterPart < 0 ? ' active' : ''}" onclick="setFilter(-1)">全部</button>` +
        PART_NAMES.map((name, i) =>
            `<button class="part-btn${state.filterPart === i ? ' active' : ''}" onclick="setFilter(${i})">${name}</button>`
        ).join('');
}

function setFilter(partIdx) {
    state.filterPart = partIdx;
    state.currentIndex = 0;
    renderPartFilter();
    renderQuestion();
    save();
}

// Keyboard shortcuts
document.addEventListener('keydown', e => {
    const filtered = getFiltered();
    if (filtered.length === 0) return;
    const q = filtered[state.currentIndex];
    if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
        e.preventDefault();
        if (state.currentIndex > 0) goTo(state.currentIndex - 1);
    }
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
        e.preventDefault();
        if (state.currentIndex < filtered.length - 1) goTo(state.currentIndex + 1);
    }
    if (e.key === 'Enter') {
        e.preventDefault();
        if (state.currentIndex < filtered.length - 1) goTo(state.currentIndex + 1);
    }
    if (!state.answers[q.id]) {
        const key = e.key.toUpperCase();
        if (['A', 'B', 'C', 'D'].includes(key)) selectAnswer(q.id, key);
        if (['1', '2', '3', '4'].includes(key)) {
            selectAnswer(q.id, ['A', 'B', 'C', 'D'][parseInt(key) - 1]);
        }
    }
});

document.getElementById('btnPrev').addEventListener('click', () => goTo(state.currentIndex - 1));
document.getElementById('btnNext').addEventListener('click', () => goTo(state.currentIndex + 1));

// Init
renderPartFilter();
renderQuestion();
</script>
